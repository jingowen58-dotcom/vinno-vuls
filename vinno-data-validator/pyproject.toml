[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vinno-data-validator"
version = "0.1.0"
description = "Draft validator for VULS 0.1 canine observation records"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.21,<5",
  "PyYAML>=6,<7",
  "rfc3339-validator>=0.1.4,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
vuls = "vuls_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
